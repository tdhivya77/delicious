<!doctype html>
<html>
  <head>
    <title>Delicious Restaurant</title>
    <link rel="stylesheet" href="style.css" />
  </head>
  <body>
    <div class="navbar">
      <a href="#home">Home</a>
      <a href="#menu">Menu</a>
      <a href="#contact">Contact</a>
    </div>

    <section id="home" class="home">
      <h1 class="title">DeLiCiOuS</h1>

      <img src="img.png" class="home-img" alt="food" />

      <div class="text">
        <h2>Welcome to Delicious</h2>
        <p>Best Food in Town 🍛</p>
      </div>
    </section>

    <section id="menu" class="menu">
      <h2>Menu</h2>

      <table>
        <tr>
          <th>Image</th>
          <th>Food Name</th>
          <th>Price</th>
        </tr>

        <tr>
          <td><img src="dosa.jpg" /></td>
          <td>Dosa</td>
          <td>₹50</td>
        </tr>

        <tr>
          <td><img src="briyani.jpg" /></td>
          <td>Biryani</td>
          <td>₹120</td>
        </tr>

        <tr>
          <td><img src="curd.jpg" /></td>
          <td>Thayir Sadam</td>
          <td>₹60</td>
        </tr>
      </table>
    </section>
    <section id="contact" class="contact">
      <h2>Contact Us</h2>

      <div class="contact-box">
        <div class="details">
          <p><b>📞 Phone:</b> 9600783280</p>
          <p><b>📧 Email:</b> dhivyathangam77@gmail.com</p>
          <p><b>📍 Location:</b> Thirunelveli</p>
        </div>

        <div class="form">
          <input type="text" placeholder="Your Name" /><br /><br />
          <input type="email" placeholder="Your Email" /><br /><br />
          <textarea placeholder="Your Message"></textarea><br /><br />
          <button>Send</button>
        </div>
      </div>
    </section>
  </body>
</html>
